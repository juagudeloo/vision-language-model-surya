# Prototype run: projector only, Qwen3-8B frozen. Decisions and evidence: docs/design_decisions.md, section 10.
llm: Qwen/Qwen3-8B
llm_precision: bf16            # bf16 | 8bit | 4bit; drop to 4bit if bf16 runs out of memory on long captions
gradient_checkpointing: true   # required for bf16 at batch 2

manifest: data/cache/manifest.jsonl
heldout_manifest: data/cache/manifest_heldout.jsonl   # regions never trained on
output_dir: runs/prototype

prompt: "Describe this solar observation."
n_visual_tokens: 256

batch_size: 2
grad_accum_steps: 4            # effective batch 8
epochs: 20
learning_rate: 3.0e-4          # LLaVA used 2e-3 at batch 128 (arXiv:2304.08485, appendix C); scaled to batch 8 that is 1.25e-4 (linear) to 5e-4 (square root). Not tuned.
warmup_ratio: 0.03             # then cosine decay to zero, as LLaVA
weight_decay: 0.0
seed: 0
log_every: 1
